# Interest profile used by the LLM to score each collected article.
# Descriptions are free text: the LLM matches meaning, not exact keywords,
# so "AI agents" also covers "agentic workflows" or "tool-using LLMs".

profile:
  # Who you are, in a few sentences. Gives the LLM the context behind the topics.
  about: >
    Software developer. Building AI agents from scratch in Python and following
    the tech industry closely. Interested in hands-on, technical content over hype.

  # Language of the text you read in the digest (summaries), as a plain name. Default: English.
  language: French

  # Topics by priority, as `id: description`.
  # - id: short and stable (lowercase, digits, dashes). The LLM returns it for each matching article
  #   and it is stored in the database: renaming it breaks the link with past articles.
  # - description: what the LLM reads. Reword it freely.
  # Remove a line to stop tagging new articles with it. Keep the list short (~10-15).
  interests:
    high:
      ai-agents: AI agents (architecture, tool use, memory, evaluation)
      llm: Large language models (new models, benchmarks, prompting, fine-tuning)
      python: Python (language, tooling, notable libraries)
    medium:
      javascript: JavaScript and TypeScript (language, runtimes, frameworks)
      apple: Apple (platforms, developer tools, hardware)
      nvidia: Nvidia (GPUs, AI hardware, CUDA)
      microsoft: Microsoft (developer tools, AI products, open source)
    low:
      dev-tooling: Developer productivity and tooling
      open-source: Open source projects gaining traction

  # Topics to push down, even if they match an interest above.
  not_interested:
    - Crypto and blockchain
    - Funding rounds and company valuations without technical content
    - Opinion pieces with no technical substance

# The daily digest. Optional: a missing key keeps its default.
digest:
  # Time to read the digest and decide what to open (not to read the articles), in whole minutes,
  # from 1 to 30. The best articles go first until this time is used. Default: 5 ("a coffee").
  reading_time_minutes: 5
  # On a day with no article to send, send a one-line activity report (articles collected, scored,
  # best score) instead of nothing, so silence never hides a broken run. Default: true.
  send_empty_report: true

# Where articles come from. `type` picks the collector, every other key is one of its options
# (see docs/architecture/collectors.md). `name` is stored as the article source.
# Security rule: official APIs and publisher feeds only, over HTTPS (see docs/security.md).
# Feeds checked on 2026-09-28: all respond, recent posts, served from the publisher's own domain.
sources:
  # --- Aggregators ---
  - type: hackernews
    feed: top
    limit: 40
    min_points: 30
  - type: rss
    name: lobsters
    url: https://lobste.rs/rss
    limit: 20

  # --- GitHub ---
  - type: github
    name: github-trending
    limit: 20
  - type: github
    name: github-ai-python
    query: "language:python topic:llm"
    min_stars: 20
    limit: 10

  # --- AI ---
  - type: rss
    name: simon-willison
    url: https://simonwillison.net/atom/everything/
    limit: 10
  - type: rss
    name: huggingface-blog
    url: https://huggingface.co/blog/feed.xml
    limit: 10
  - type: rss
    name: openai-news
    url: https://openai.com/news/rss.xml
    limit: 10
  - type: rss
    name: arxiv-cs-ai
    url: https://rss.arxiv.org/rss/cs.AI
    limit: 15  # Hundreds of papers a day: keep this low.

  # --- Python ---
  - type: rss
    name: python-insider
    url: https://blog.python.org/feeds/posts/default
    limit: 10
  - type: rss
    name: realpython
    url: https://realpython.com/atom.xml
    limit: 10

  # --- JavaScript / TypeScript ---
  - type: rss
    name: nodejs-blog
    url: https://nodejs.org/en/feed/blog.xml
    limit: 10
  - type: rss
    name: typescript-blog
    url: https://devblogs.microsoft.com/typescript/feed/
    limit: 10

  # --- Apple ---
  - type: rss
    name: apple-developer-news
    url: https://developer.apple.com/news/rss/news.rss
    limit: 10
  - type: rss
    name: swift-blog
    url: https://www.swift.org/atom.xml
    limit: 10

  # --- Nvidia ---
  - type: rss
    name: nvidia-developer-blog
    url: https://developer.nvidia.com/blog/feed
    limit: 10

  # --- Microsoft / GitHub ---
  - type: rss
    name: microsoft-devblogs
    url: https://devblogs.microsoft.com/feed/
    limit: 10
  - type: rss
    name: github-blog
    url: https://github.blog/feed/
    limit: 10
