[project]
name = "tech-radar-agent"
version = "0.1.0"
description = "A personal tech-watch agent that uses an LLM to curate a daily digest of developer news."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
tech-radar-agent = "tech_radar_agent:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
